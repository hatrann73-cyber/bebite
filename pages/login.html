<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Bébite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Original+Surfer&family=Potta+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../components/components.css">
    <style>
        :root{--blue:#1C60B8;--lime:#CBF55D;--cream-light:#FFFFF1;--white:#fff;--font-body:"Montserrat",sans-serif}
        *{box-sizing:border-box} body{margin:0;font-family:var(--font-body);background:var(--cream-light);color:var(--blue)}
        a{font-family:var(--font-body)}
        /* LOGIN */
        .login-main{min-height:calc(100vh - 98px);display:flex;align-items:center;justify-content:center;padding:70px 20px 90px}.login-wrapper{width:min(1050px,94%);display:grid;grid-template-columns:1fr 1fr;background:var(--white);box-shadow:0 18px 50px rgba(6,51,179,.08)}.login-intro{min-height:540px;padding:65px 60px;background:var(--blue);color:var(--white);display:flex;flex-direction:column;justify-content:center}.login-small-title{margin:0 0 18px;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime)}.login-intro h1{margin:0 0 22px;font-size:clamp(32px,4vw,52px);line-height:1.08;font-weight:700}.login-intro p{max-width:410px;margin:0;font-size:13px;line-height:1.8;color:rgba(255,255,255,.88)}.login-card{padding:65px 60px;display:flex;flex-direction:column;justify-content:center}.login-card h2{margin:0 0 10px;font-size:25px}.login-subtitle{margin:0 0 30px;color:#5570a9;font-size:11px;line-height:1.6}.login-form{display:flex;flex-direction:column;gap:18px}.login-field{display:flex;flex-direction:column;gap:8px}.login-field label{font-size:10px;font-weight:700;letter-spacing:.4px}.login-field input{width:100%;height:46px;border:1px solid rgba(6,51,179,.18);background:#fff;padding:0 14px;outline:0;color:var(--blue);font-family:var(--font-body);font-size:12px}.login-field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,51,179,.06)}.login-error{display:none;margin:-4px 0 0;color:#c53a3a;font-size:10px;line-height:1.5}.login-error.show{display:block}.login-submit{width:100%;height:46px;margin-top:4px;border:0;background:var(--blue);color:#fff;font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.5px;cursor:pointer}.login-submit:hover{background:#05288e}.login-register{margin:22px 0 0;text-align:center;color:#6a7da8;font-size:10px}.login-register a{color:var(--blue);font-weight:700;text-decoration:none}.login-register a:hover{text-decoration:underline}
    </style>
</head>
<body>
<div id="bebite-header"></div>


    <main class="login-main">
        <section class="login-wrapper">
            <div class="login-intro">
                <p class="login-small-title">BÉBITE ACCOUNT</p>
                <h1>CHÀO MỪNG<br>BẠN TRỞ LẠI!</h1>
                <p>Đăng nhập để tiếp tục hành trình cùng Bébite và khám phá những gợi ý phù hợp hơn cho bé.</p>
            </div>
            <div class="login-card">
                <h2>ĐĂNG NHẬP</h2>
                <p class="login-subtitle">Sử dụng email và mật khẩu bạn đã đăng ký.</p>
                <form class="login-form" id="loginForm">
                    <div class="login-field"><label for="loginEmail">EMAIL</label><input type="email" id="loginEmail" placeholder="Nhập email của bạn" autocomplete="email" required></div>
                    <div class="login-field"><label for="loginPassword">MẬT KHẨU</label><input type="password" id="loginPassword" placeholder="Nhập mật khẩu" autocomplete="current-password" required></div>
                    <p class="login-error" id="loginError"></p>
                    <button type="submit" class="login-submit">ĐĂNG NHẬP</button>
                </form>
                <p class="login-register">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
            </div>
        </section>
    </main>
<div id="bebite-footer"></div>
<script src="../bebite.js"></script>
<script src="login.js"></script>
<script src="../components/components.js"></script>
</body>
</html>
